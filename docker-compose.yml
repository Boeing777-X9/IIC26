services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: retinix-backend:latest
    container_name: retinix-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MONGODB_URI=${MONGODB_URI:-mongodb://localhost:27017}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-retinagrid}
      - CHECKPOINT_PATH=/app/ML/classifier.pt
    env_file:
      - path: ./atlas-credentials.env
        required: false
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/db-status"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api}
    image: retinix-frontend:latest
    container_name: retinix-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api}
    depends_on:
      backend:
        condition: service_healthy
